spring:
  application:
    name: CouponEventProject

  datasource:
    url: jdbc:mariadb://localhost:3306/coupon
    username: root
    password: password
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        show_sql: true
